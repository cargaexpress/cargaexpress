AWSTemplateFormatVersion: "2010-09-09"
Description: >
  S3 bucket with static website hosting for the documentation (Docusaurus).
  The content is public and read-only. Do not publish confidential information.

Parameters:
  BucketName:
    Type: String
    Description: Globally unique bucket name (lowercase letters, numbers and hyphens)
    AllowedPattern: "^[a-z0-9][a-z0-9-]{2,62}$"

Resources:
  SiteBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Ref BucketName
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      WebsiteConfiguration:
        IndexDocument: index.html
        ErrorDocument: 404.html

  SiteReadPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref SiteBucket
      PolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Sid: PublicReadOfSite
            Effect: Allow
            Principal: "*"
            Action: s3:GetObject
            Resource: !Sub "arn:${AWS::Partition}:s3:::${BucketName}/*"

Outputs:
  BucketName:
    Value: !Ref SiteBucket
  SiteUrl:
    Description: Public site address (HTTP)
    Value: !GetAtt SiteBucket.WebsiteURL
